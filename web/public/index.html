<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>CrossPoint Cards</title>
<style>
  /* Modern mobile: system sans, soft white surfaces on a neutral ground,
     grouped lists, one vivid accent, tinted semantic buttons, true-black dark. */
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #111214;
    --muted: #6e6e73;
    --line: #e7e7ec;
    --fill: #eeeef2;
    --accent: #ff6a2b;
    --red: #e63b2f;
    --blue: #0a6cff;
    --green: #1fa04b;
    --shadow: 0 1px 2px rgba(17, 18, 20, .05), 0 4px 16px rgba(17, 18, 20, .05);
    --radius: 20px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0f;
      --card: #1b1b1f;
      --text: #f4f4f6;
      --muted: #97979f;
      --line: #2b2b30;
      --fill: #28282e;
      --accent: #ff7d42;
      --red: #ff5348;
      --blue: #4a94ff;
      --green: #35c962;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top) + 12px) 18px 10px;
    flex-shrink: 0;
  }
  header .back {
    border: none; background: var(--card); box-shadow: var(--shadow);
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px 2px 0;
  }
  header h1 { font-size: 21px; margin: 0; flex: 1; font-weight: 700; letter-spacing: -.2px; }
  header .streak {
    font-size: 14px; font-weight: 700; white-space: nowrap; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  header .status {
    font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer;
    border: none; border-radius: 999px; padding: 6px 11px;
    color: var(--muted); background: var(--fill);
  }
  header .status[data-kind=offline] { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
  header .status[data-kind=syncing] { color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, transparent); }
  header .status[data-kind=locked] { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }

  main {
    flex: 1; min-height: 0;
    padding: 8px 18px calc(env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column; gap: 14px;
    max-width: 560px; width: 100%; margin: 0 auto;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  main.no-scroll { overflow: hidden; }
  .hidden { display: none !important; }
  .sub { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.5; }

  /* grouped lists */
  .group { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .group.pad { padding: 16px; }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 13px 16px; background: none; border: none; text-align: left; cursor: pointer;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row:active { background: var(--fill); }
  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row-title { font-size: 17px; font-weight: 600; }
  .row-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--fill); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 21px;
  }
  .chevron { color: var(--muted); font-size: 20px; font-weight: 400; opacity: .6; }
  .due-pill {
    font-size: 13px; font-weight: 700; color: #fff; background: var(--accent);
    border-radius: 999px; padding: 4px 10px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .tile-num { font-size: 28px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .tile-den { font-size: 16px; font-weight: 600; color: var(--muted); }
  .tile-label { font-size: 13px; color: var(--muted); font-weight: 500; margin-top: 2px; }

  /* buttons */
  .btn {
    border: none; border-radius: 16px; padding: 16px; font-size: 17px; font-weight: 600;
    cursor: pointer; width: 100%; background: var(--fill); color: var(--text);
    transition: transform .12s ease;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.plain { background: none; color: var(--muted); font-size: 15px; padding: 10px; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; }

  /* study */
  .study-top { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  .progress { height: 4px; border-radius: 999px; background: var(--fill); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .25s ease; }
  .study-meta {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 13px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums;
  }
  .card-wrap { flex: 1; display: flex; min-height: 0; perspective: 1200px; }
  .card {
    flex: 1; position: relative; cursor: pointer;
    transform-style: preserve-3d; transition: transform .3s cubic-bezier(.2,.7,.3,1);
    min-height: 160px;
  }
  .card.flipped { transform: rotateX(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--card); border-radius: 24px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 22px; overflow: hidden;
  }
  .face.answer { transform: rotateX(180deg); }
  .face .word { font-weight: 700; text-align: center; overflow-wrap: anywhere; line-height: 1.25; letter-spacing: -.3px; }
  .face.answer .word { font-weight: 500; }
  .face .hint { position: absolute; bottom: 14px; font-size: 12px; color: var(--muted); font-weight: 500; }

  .rate-row { display: flex; gap: 10px; flex-shrink: 0; }
  .rate-row .btn { padding: 16px 6px; font-size: 16px; font-weight: 700; }
  .btn.hard { background: color-mix(in srgb, var(--red) 13%, transparent); color: var(--red); }
  .btn.good { background: color-mix(in srgb, var(--blue) 13%, transparent); color: var(--blue); }
  .btn.easy { background: var(--green); color: #fff; }

  /* files */
  .file-del {
    background: var(--fill); border: none; color: var(--muted); font-size: 13px; cursor: pointer;
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; line-height: 1;
  }
  .file-del:active { color: #fff; background: var(--red); }
  pre.viewer {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.6;
    background: none; padding: 12px 16px; overflow: auto; white-space: pre-wrap; margin: 0; color: var(--muted);
    border-top: 1px solid var(--line);
  }
  pre.viewer + .row { border-top: 1px solid var(--line); }

  textarea, input[type=text], input[type=number], input[type=password] {
    width: 100%; background: var(--fill); color: var(--text);
    border: none; border-radius: 12px; padding: 13px 14px;
    font-size: 16px; font-family: inherit;
  }
  textarea { min-height: 110px; resize: vertical; }
  .setting-label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .setting-inline { display: flex; align-items: center; gap: 12px; }
  .setting-inline input[type=number] { width: 110px; font-variant-numeric: tabular-nums; }
  .setting-range { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 50;
    max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  .overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 40;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px;
  }
  .overlay h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.3px; }
  .overlay input {
    max-width: 250px; text-align: center; font-size: 24px; letter-spacing: 8px;
    background: var(--card); box-shadow: var(--shadow); border-radius: 16px; padding: 14px;
  }
  .overlay .btn { max-width: 250px; }
</style>
</head>
<body>
<header>
  <button class="back hidden" id="backBtn">&#8249;</button>
  <h1 id="title">CrossPoint Cards</h1>
  <span class="streak" id="streak"></span>
  <button class="status" id="status" title="Tap to sync"></button>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="overlay hidden" id="tokenOverlay">
  <h2>Enter PIN</h2>
  <input type="password" id="tokenInput" placeholder="&#8226;&#8226;&#8226;&#8226;" inputmode="numeric" autocomplete="off" maxlength="12">
  <button class="btn primary" id="tokenSave">Unlock &amp; sync</button>
  <button class="btn plain" id="tokenSkip">Study offline</button>
</div>

<script src="/engine.js"></script>
<script src="/app.js"></script>
</body>
</html>
